
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Chelliii....</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #b3e5fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .left-content {
            animation: slideInLeft 0.8s ease-out;
        }

        .right-content {
            animation: slideInRight 0.8s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .celebration-badge {
            color: #0d47a1;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .celebration-badge span {
            font-size: 24px;
            margin: 0 8px;
        }

        h1 {
            font-size: 100px;
            color: #0d47a1;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: -2px;
        }

        .name {
            color: #0d47a1;
            font-size: 48px;
            font-weight: 700;
        }

        .message {
            color: #4a5568;
            font-size: 18px;
            line-height: 1.8;
            margin: 40px 0;
            font-weight: 500;
        }

        .hearts {
            display: inline-block;
            color: #42a5f5;
            font-size: 20px;
            margin: 0 8px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(21, 101, 192, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #42a5f5 0%, #2196f3 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }

        .photo-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 8px solid white;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f3e8ff 0%, #fce7f3 100%);
            color: #a78bfa;
            font-size: 60px;
        }

        .photo-placeholder span {
            margin-top: 20px;
            font-size: 20px;
            color: #c084fc;
            font-weight: 600;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .decorative-hearts {
            position: absolute;
            font-size: 24px;
            animation: float 3s ease-in-out infinite;
        }

        .heart-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .heart-2 { top: 30%; right: 8%; animation-delay: 0.5s; }
        .heart-3 { bottom: 20%; left: 10%; animation-delay: 1s; }
        .heart-4 { top: 50%; right: 5%; animation-delay: 1.5s; }
        .heart-5 { bottom: 10%; right: 15%; animation-delay: 0.7s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            h1 {
                font-size: 60px;
            }

            .name {
                font-size: 36px;
            }

            .message {
                font-size: 16px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Small desktops and large tablets (769px - 1023px) */
        @media (min-width: 769px) and (max-width: 1023px) {
            body {
                padding: 25px;
            }

            .container {
                max-width: 900px;
                gap: 40px;
            }

            h1 {
                font-size: 80px;
            }

            .name {
                font-size: 42px;
            }

            .message {
                font-size: 17px;
                margin: 35px 0;
            }

            .celebration-badge {
                font-size: 16px;
            }

            .celebration-badge span {
                font-size: 22px;
            }

            .photo-container {
                aspect-ratio: 4/5;
            }
        }

        /* Medium desktops (1024px - 1439px) */
        @media (min-width: 1024px) and (max-width: 1439px) {
            body {
                padding: 30px;
            }

            .container {
                max-width: 1100px;
                gap: 50px;
            }

            h1 {
                font-size: 90px;
            }

            .name {
                font-size: 45px;
            }

            .message {
                font-size: 18px;
                margin: 38px 0;
            }

            .celebration-badge {
                font-size: 17px;
            }

            .celebration-badge span {
                font-size: 23px;
            }

            .photo-container {
                aspect-ratio: 3/4;
            }
        }

        /* Large desktops (1440px+) */
        @media (min-width: 1440px) {
            body {
                padding: 35px;
            }

            .container {
                max-width: 1300px;
                gap: 70px;
            }

            h1 {
                font-size: 110px;
                letter-spacing: -3px;
            }

            .name {
                font-size: 50px;
            }

            .message {
                font-size: 19px;
                margin: 45px 0;
            }

            .celebration-badge {
                font-size: 19px;
            }

            .celebration-badge span {
                font-size: 25px;
            }

            .photo-container {
                aspect-ratio: 3/4;
            }

            .decorative-hearts {
                font-size: 28px;
            }
        }

        /* Ultra-wide displays (1920px+) */
        @media (min-width: 1920px) {
            body {
                padding: 40px;
            }

            .container {
                max-width: 1500px;
                gap: 80px;
            }

            h1 {
                font-size: 120px;
                letter-spacing: -4px;
            }

            .name {
                font-size: 55px;
            }

            .message {
                font-size: 20px;
                margin: 50px 0;
            }

            .celebration-badge {
                font-size: 20px;
            }

            .celebration-badge span {
                font-size: 26px;
            }

            .photo-container {
                aspect-ratio: 3/4;
            }

            .decorative-hearts {
                font-size: 32px;
            }

            /* Adjust heart positions for ultra-wide screens */
            .heart-1 { top: 8%; left: 3%; }
            .heart-2 { top: 25%; right: 6%; }
            .heart-3 { bottom: 18%; left: 8%; }
            .heart-4 { top: 45%; right: 4%; }
            .heart-5 { bottom: 12%; right: 12%; }
        }
    </style>
</head>
<body>
    <div class="decorative-hearts heart-1">💙</div>
    <div class="decorative-hearts heart-2">💙</div>
    <div class="decorative-hearts heart-3">💙</div>
    <div class="decorative-hearts heart-4">💙</div>
    <div class="decorative-hearts heart-5">💙</div>

    <div class="container">
        <div class="left-content">
            <div class="celebration-badge">
                🎁 <span>A Special Birthday Celebration</span> 🎁
            </div>

            <h1>Happy<br>Birthday<br><span class="name">Chelliiii....</span></h1>

            <p class="message">
                Thank you for filling every moment of life with happiness, support, and endless love. 
                Today is all about celebrating the amazing person you are. <span class="hearts">💙</span>
            </p>

            <div class="button-group">
                <button class="btn btn-primary">🎉 Birthday Wishes</button>
            </div>
        </div>

        <div class="right-content">
            <div class="photo-container">
                <img src="kavya2.jpeg" alt="Birthday Girl">
                <!-- Replace the above img src with your sister's photo URL or local path -->
            </div>
        </div>
    </div>

    <script src="bday.js"></script>
    <script>
        // Add button click animations and interactivity
        const buttons = document.querySelectorAll('.btn');
        
        buttons.forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                this.appendChild(ripple);
            });
        });

        // Enhanced button functionality
        document.querySelector('.btn-primary').addEventListener('click', function() {
            window.location.href = 'wishes.html';
        });

        // Make name customizable (optional - for dynamic updates)
        // Uncomment to use: changeSisterName('Kavya')
        function changeSisterName(name) {
            document.querySelector('.name').textContent = name;
            document.title = `Happy Birthday ${name}`;
        }
    </script>
</body>
</html>
