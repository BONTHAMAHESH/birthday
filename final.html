<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Wish</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bbdefb 100%);
            color: #0d47a1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .final-page {
            width: min(95%, 980px);
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 56px;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            display: none;
        }

        .final-page {
            width: min(95%, 980px);
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            position: relative;
            overflow: hidden;
        }

        .celebration {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .celebration span {
            position: absolute;
            width: 12px;
            height: 12px;
            opacity: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd54f 0%, #ffca28 60%, #f57f17 100%);
            animation: floatConfetti 1.8s ease-out infinite;
        }

        .celebration span:nth-child(1) { left: 8%; animation-delay: 0.1s; animation-duration: 2.1s; }
        .celebration span:nth-child(2) { left: 20%; animation-delay: 0.3s; animation-duration: 2.2s; }
        .celebration span:nth-child(3) { left: 32%; animation-delay: 0.15s; animation-duration: 2.4s; }
        .celebration span:nth-child(4) { left: 44%; animation-delay: 0.35s; animation-duration: 2s; }
        .celebration span:nth-child(5) { left: 56%; animation-delay: 0.05s; animation-duration: 2.3s; }
        .celebration span:nth-child(6) { left: 68%; animation-delay: 0.25s; animation-duration: 2.5s; }
        .celebration span:nth-child(7) { left: 80%; animation-delay: 0.18s; animation-duration: 2.15s; }
        .celebration span:nth-child(8) { left: 92%; animation-delay: 0.33s; animation-duration: 2.35s; }

        @keyframes floatConfetti {
            0% { transform: translateY(-20px) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(420px) scale(1.1); opacity: 0; }
        }

        .preview {
            width: 100%;
            min-height: 420px;
            border-radius: 28px;
            overflow: hidden;
            background: #d9eefd;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #dfefff;
            margin-bottom: 24px;
            position: relative;
        }

        .preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('./kavya20.png') center/cover no-repeat;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        .preview.empty {
            color: #5f8bbd;
            font-size: 20px;
            padding: 24px;
            position: relative;
            z-index: 2;
        }

        .preview::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.45);
            z-index: 1;
        }

        .field {
            display: none;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }

        .final-note {
            margin-top: 30px;
            text-align: center;
            font-size: 18px;
            color: #0d47a1;
            font-weight: 600;
            position: relative;
            z-index: 2;
        }

        .buttons a,
        .buttons button {
            padding: 14px 28px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
            color: white;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .buttons a:hover,
        .buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(13, 71, 161, 0.2);
        }
    </style>
</head>
<body>
    <div class="final-page">
            <div class="celebration" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <h1>✨ Happy Birthday Chelliii...🥰</h1>
            
            <div class="preview" id="final-preview">
                <img src="./kavya20.png" alt="Final birthday wish image" />
            </div>

            <div class="buttons">
                <a href="wishes.html">← Back to Slot Template</a>
            </div>

            <div class="final-note">Best wishes from your brother</div>
        </div>
    <script src="bday.js"></script>
    <script>
        const preview = document.getElementById('final-preview');

        function loadDefaultImage() {
            if (!preview.querySelector('img')) {
                const img = document.createElement('img');
                img.src = './kavya20.png';
                img.alt = 'Final birthday wish image';
                preview.innerHTML = '';
                preview.appendChild(img);
            }
        }

        window.addEventListener('DOMContentLoaded', loadDefaultImage);
    </script>
</body>
</html>
